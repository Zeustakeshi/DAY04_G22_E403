# starter_v0 — tool declarations.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng thông tin còn thiếu hoặc xin xác nhận trước khi thực hiện hành động."
    parameters:
      type: object
      properties:
        question: {type: string, description: "Nội dung câu hỏi dành cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], description: "Kiểu phản hồi: 'text' khi hỏi thêm thông tin còn thiếu (handle, URL...), 'yes_no' khi cần người dùng xác nhận có gửi/đăng nội dung hay không."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn nếu có"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một tài khoản Twitter/X. Dùng duy nhất khi biết cụ thể tài khoản/handle."
    parameters:
      type: object
      properties:
        screenname: {type: string, description: "Handle Twitter/X (ví dụ: sama, elonmusk, karpathy). Tuyệt đối không tự đoán handle nếu thiếu."}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng trên mạng xã hội Twitter/X theo chủ đề hoặc từ khóa."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa chủ đề (ví dụ: 'GPT-5', 'OpenAI', 'AI')"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Dùng 'Top' khi tìm bài đăng phổ biến/nổi bật, 'Latest' khi tìm bài mới nhất."}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin tin tức hoặc tìm kiếm trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa tìm kiếm (ví dụ: 'AI', 'robotics', 'OpenAI'). Không bao gồm từ 'news' hoặc 'tin tức' vào query khi topic là 'news'."}
        topic: {type: string, enum: [general, news], default: "general", description: "Chọn 'news' khi tìm tin tức, thời sự."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' cho hôm nay, 'week' cho tuần này."}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ một địa chỉ URL."
    parameters:
      type: object
      properties:
        url: {type: string, description: "URL bài viết cần đọc."}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản lên Telegram."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools ----------------
  - name: web_search
    description: "Tìm kiếm trên web (DuckDuckGo, không cần API key) khi chưa có URL cụ thể. Không dùng khi đã có link (đó là fetch) hoặc khi cần bài báo khoa học (đó là paper_search)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: paper_search
    description: "Tìm bài báo khoa học trực tiếp trên arXiv (không cần API key). Dùng khi người dùng muốn tài liệu/paper học thuật, không dùng cho tin tức hay web thường."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm bài báo"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: summarize
    description: "Tóm tắt trích xuất (extractive) một đoạn văn bản dài (thường là kết quả fetch) thành các câu chính. Dùng sau khi đã fetch/có văn bản dài, trước khi format/send."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Văn bản cần tóm tắt"}
        max_sentences: {type: integer, default: 3, description: "Số câu giữ lại"}
      required: [text]

  - name: keyword_extract
    description: "Rút ra các từ khóa quan trọng nhất từ một đoạn văn bản. Dùng khi người dùng hỏi về chủ đề chính/từ khóa/thuật ngữ quan trọng của nội dung đã có."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Văn bản cần rút từ khóa"}
        max_keywords: {type: integer, default: 5, description: "Số từ khóa tối đa"}
      required: [text]
